<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sメ PANEL — Features</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="grid-background"></div>

    <div class="red-glow glow-one"></div>
    <div class="red-glow glow-two"></div>

    <div class="scan-effect"></div>


    <!-- HEADER -->

    <header class="login-top">

        <div class="mini-logo">
            Sメ PANEL
        </div>

        <div class="system-status">

            <span class="online-dot"></span>

            SYSTEM ONLINE

        </div>

    </header>


    <!-- FEATURES -->

    <main class="features-page">

        <div class="page-heading">

            <span>
                Sメ CONTROL SYSTEM
            </span>

            <h1>
                FEATURES
            </h1>

            <p>
                Select a control module
            </p>

        </div>


        <section class="features-grid">


            <!-- UMP -->

            <button
                class="feature-card"
                onclick="featureInfo('UMP RECOIL')"
            >

                <div class="feature-number">
                    01
                </div>

                <div class="feature-icon">
                    U
                </div>

                <div class="feature-text">

                    <strong>
                        UMP RECOIL
                    </strong>

                    <span>
                        AIM CONTROL
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- HEADSHOT -->

            <button
                class="feature-card"
                onclick="featureInfo('HEADSHOT')"
            >

                <div class="feature-number">
                    02
                </div>

                <div class="feature-icon">
                    H
                </div>

                <div class="feature-text">

                    <strong>
                        HEADSHOT
                    </strong>

                    <span>
                        AIM GUIDE
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- AIM FOV -->

            <button
                class="feature-card"
                onclick="featureInfo('AIM FOV')"
            >

                <div class="feature-number">
                    03
                </div>

                <div class="feature-icon">
                    F
                </div>

                <div class="feature-text">

                    <strong>
                        AIM FOV
                    </strong>

                    <span>
                        FIELD OF VIEW
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- DRAG -->

            <button
                class="feature-card"
                onclick="featureInfo('DRAG HEADSHOT')"
            >

                <div class="feature-number">
                    04
                </div>

                <div class="feature-icon">
                    D
                </div>

                <div class="feature-text">

                    <strong>
                        DRAG HEADSHOT
                    </strong>

                    <span>
                        DRAG TECHNIQUE
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- ONE TAP -->

            <button
                class="feature-card"
                onclick="featureInfo('ONE TAP')"
            >

                <div class="feature-number">
                    05
                </div>

                <div class="feature-icon">
                    1
                </div>

                <div class="feature-text">

                    <strong>
                        ONE TAP
                    </strong>

                    <span>
                        AIM PRACTICE
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- RED NUMBER -->

            <button
                class="feature-card"
                onclick="featureInfo('RED NUMBER')"
            >

                <div class="feature-number">
                    06
                </div>

                <div class="feature-icon">
                    #
                </div>

                <div class="feature-text">

                    <strong>
                        RED NUMBER
                    </strong>

                    <span>
                        DAMAGE DISPLAY
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


            <!-- STABLE PIN -->

            <button
                class="feature-card"
                onclick="featureInfo('STABLE PIN')"
            >

                <div class="feature-number">
                    07
                </div>

                <div class="feature-icon">
                    P
                </div>

                <div class="feature-text">

                    <strong>
                        STABLE PIN
                    </strong>

                    <span>
                        CONTROL GUIDE
                    </span>

                </div>

                <b>
                    →
                </b>

            </button>


        </section>


        <!-- NAVIGATION -->

        <div class="page-navigation">

            <a href="sensitivity.html">
                ← SENSITIVITY
            </a>

            <a href="profile.html">
                PROFILE →
            </a>

        </div>


        <!-- CREATOR -->

        <div class="creator">

            <small>
                CREATED BY
            </small>

            <strong>
                @be.like_sshil
            </strong>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
